name: compile assets

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Builds dist/ with no write token on disk: npm and Vite plugin code
  # only ever runs in this job.
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Install NPM dependencies
        run: npm ci --ignore-scripts

      - name: Compile assets
        run: npm run build

      - name: Upload compiled assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  # Commits the built dist/ back. Holds the write token but runs no npm code.
  commit:
    needs: compile
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Clear old assets
        run: rm -rf dist

      - name: Download compiled assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Commit compiled files
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: Compile Assets
          file_pattern: dist/
