name: compile assets

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Builds dist/ with no write token on disk: npm and Vite plugin code
  # only ever runs in this job.
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      - name: Install NPM dependencies
        run: npm ci --ignore-scripts

      - name: Compile assets
        run: npm run build

      - name: Upload compiled assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  # Commits the built dist/ back. Holds the write token but runs no npm code.
  commit:
    needs: compile
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Clear old assets
        run: rm -rf dist

      - name: Download compiled assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Commit compiled files
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        with:
          commit_message: Compile Assets
          file_pattern: dist/
